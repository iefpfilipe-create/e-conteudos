<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Introdução UC02209</title>
</head>
<body>

    <div class="moodle-wrapper">
        <div class="moodle-slideshow-container" id="moodleMainContainer">
            
            <!-- Slides com as imagens da UC02209 -->
            <div class="moodle-slide active">
                <img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 1.png" alt="Página 1">
            </div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 2.png" alt="Página 2"></div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 3.png" alt="Página 3"></div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 4.png" alt="Página 4"></div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 5.png" alt="Página 5"></div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 6.png" alt="Página 6"></div>
            <div class="moodle-slide"><img src="https://iefpfilipe.infinityfree.me/introUC02209/intro 7.png" alt="Página 7"></div>

            <!-- Controlos de Navegação -->
            <button class="moodle-btn moodle-prev" id="btnPrev" aria-label="Anterior">&#10094;</button>
            <button class="moodle-btn moodle-next" id="btnNext" aria-label="Seguinte">&#10095;</button>
            
            <!-- Botão Play/Pause -->
            <button class="moodle-play-pause" id="btnPlayPause" aria-label="Reproduzir ou Pausar">&#10074;&#10074;</button>

            <!-- Indicadores (Dots) -->
            <div class="moodle-dots" id="moodleDots"></div>
        </div>
    </div>

    <script>
        (function() {
            // Injeção de CSS via JavaScript para evitar que o Moodle filtre os estilos
            const css = `
                .moodle-wrapper { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 10px 0; }
                .moodle-slideshow-container {
                    position: relative; width: 100%; max-width: 1280px; margin: 0 auto;
                    aspect-ratio: 16 / 9; background: #1a1a1a; overflow: hidden;
                    border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                }
                .moodle-slide { display: none; position: absolute; inset: 0; width: 100%; height: 100%; }
                .moodle-slide.active { display: block; animation: moodleFade 0.6s ease-in-out; }
                .moodle-slide img { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
                @keyframes moodleFade { from { opacity: 0.4; } to { opacity: 1; } }
                
                .moodle-btn {
                    position: absolute; top: 50%; transform: translateY(-50%);
                    background: rgba(0,0,0,0.3); border: none; color: white;
                    width: 44px; height: 44px; cursor: pointer; border-radius: 50%; z-index: 10;
                    transition: all 0.3s; display: flex; align-items: center; justify-content: center;
                    font-size: 20px;
                }
                .moodle-btn:hover { background: rgba(255,255,255,0.2); }
                .moodle-prev { left: 10px; }
                .moodle-next { right: 10px; }
                
                .moodle-play-pause {
                    position: absolute; top: 15px; right: 15px;
                    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white;
                    width: 36px; height: 36px; cursor: pointer; border-radius: 50%; z-index: 10;
                    display: flex; align-items: center; justify-content: center; font-size: 12px;
                    transition: all 0.3s;
                }
                .moodle-play-pause:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }

                .moodle-dots {
                    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
                    display: flex; gap: 6px; z-index: 10;
                }
                .moodle-dot { width: 8px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: all 0.3s; }
                .moodle-dot.active { background: #fff; transform: scale(1.2); box-shadow: 0 0 5px rgba(255,255,255,0.5); }
                
                @media (max-width: 600px) {
                    .moodle-btn { width: 32px; height: 32px; font-size: 16px; }
                    .moodle-slideshow-container { aspect-ratio: 4 / 3; } /* Ajuste opcional para mobile se as imagens forem verticais */
                }
            `;
            const styleHead = document.createElement('style');
            styleHead.textContent = css;
            document.head.appendChild(styleHead);

            let currentIndex = 0;
            const container = document.getElementById('moodleMainContainer');
            const slides = container.getElementsByClassName('moodle-slide');
            const dotsContainer = document.getElementById('moodleDots');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnPlayPause = document.getElementById('btnPlayPause');
            const total = slides.length;
            let timer;
            let isAutoPlaying = true;

            function init() {
                // Criar dots dinamicamente
                for (let i = 0; i < total; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'moodle-dot' + (i === 0 ? ' active' : '');
                    dot.addEventListener('click', function() { goTo(i); });
                    dotsContainer.appendChild(dot);
                }

                // Eventos dos botões laterais
                btnPrev.addEventListener('click', function() {
                    update(currentIndex - 1);
                    if (isAutoPlaying) resetTimer();
                });

                btnNext.addEventListener('click', function() {
                    update(currentIndex + 1);
                    if (isAutoPlaying) resetTimer();
                });

                // Evento Play/Pause
                btnPlayPause.addEventListener('click', function() {
                    if (isAutoPlaying) {
                        stopAuto();
                        btnPlayPause.innerHTML = '&#9658;'; // Ícone Play
                    } else {
                        startAuto();
                        btnPlayPause.innerHTML = '&#10074;&#10074;'; // Ícone Pause
                    }
                    isAutoPlaying = !isAutoPlaying;
                });

                // Suporte para teclado
                document.addEventListener('keydown', function(e) {
                    if (e.key === "ArrowLeft") btnPrev.click();
                    if (e.key === "ArrowRight") btnNext.click();
                });

                startAuto();
            }

            function update(index) {
                const dots = dotsContainer.getElementsByClassName('moodle-dot');
                if (index >= total) currentIndex = 0;
                else if (index < 0) currentIndex = total - 1;
                else currentIndex = index;

                for (let i = 0; i < total; i++) {
                    slides[i].classList.remove('active');
                    dots[i].classList.remove('active');
                }
                
                slides[currentIndex].classList.add('active');
                dots[currentIndex].classList.add('active');
            }

            function goTo(n) {
                update(n);
                if (isAutoPlaying) resetTimer();
            }

            function startAuto() {
                timer = setInterval(function() {
                    update(currentIndex + 1);
                }, 5000);
            }

            function stopAuto() {
                clearInterval(timer);
            }

            function resetTimer() {
                stopAuto();
                startAuto();
            }

            init();
        })();
    </script>
</body>
</html>
